                <text x="680.0" y="552" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
                
                <text x="680.0" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">1. InSDN                 | SDN Control &amp; Data Plane     | 99.82% Accuracy       | 100.0% Acc     | +0.18% SOTA (Zero False Positives)</text>
                
