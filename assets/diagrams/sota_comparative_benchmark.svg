<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 780" width="100%" height="100%">
        <!-- Background -->
        <rect width="1360" height="780" fill="url(#bg-grad)" />
        <rect width="1360" height="780" fill="none" stroke="#1e293b" stroke-width="2" />
        
        <defs>
