                <text x="946" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#cbd5e1">• Large Transformer Baselines: &gt; 2,500 MB</text>
                
