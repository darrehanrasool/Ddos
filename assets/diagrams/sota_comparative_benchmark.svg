                <text x="680.0" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">3. CIC-IDS2017           | Enterprise Cloud Intrusions   | 99.10% Accuracy       | 100.0% Acc     | +0.90% SOTA (Complete Hulk/Slowloris Defeat)</text>
                
                <text x="680.0" y="616" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">4. NSL-KDD               | Legacy Protocol Attack Vectors| 98.20% Accuracy       | 99.80% Acc     | +1.60% SOTA (Eliminates Smurf/Neptune Floods)</text>
                
                <text x="680.0" y="632" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">5. BoT-IoT               | IoT Smart Home / Sensors      | 95.80% Accuracy       | 96.90% Acc     | +1.10% SOTA (Catches Low-Rate Mirai Swarms)</text>
                
                <text x="680.0" y="648" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">6. ToN-IoT               | Industrial IIoT Telemetry     | 94.60% Accuracy       | 97.20% Acc     | +2.60% SOTA (Zero IIoT Protocol Disruption)</text>
                
                <text x="680.0" y="664" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
                
