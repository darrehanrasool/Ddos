models:
  classical:
    logistic_regression:
      penalty: "l2"
      C: 1.0
      solver: "lbfgs"
      max_iter: 1000
      class_weight: "balanced"
      random_state: 42

    random_forest:
      n_estimators: 200
      max_depth: 20
      min_samples_split: 5
      min_samples_leaf: 2
      max_features: "sqrt"
      class_weight: "balanced_subsample"
      n_jobs: -1
      random_state: 42

    gradient_boosting:
      learning_rate: 0.05
      n_estimators: 300
      max_depth: 8
      subsample: 0.8
      colsample_bytree: 0.8
      gamma: 0.1
      reg_alpha: 0.01
      reg_lambda: 1.0
      random_state: 42

    svm:
      C: 1.0
      kernel: "rbf"
      gamma: "scale"
      probability: true
      max_iter: 2000
      random_state: 42

  deep_learning:
    tabular_mlp:
      input_dim: 70
      hidden_dims: [256, 128, 64]
      dropout_rates: [0.3, 0.2, 0.1]
      activation: "gelu"
      use_batch_norm: true
      use_residual: true
      output_dim: 2 # 2 for binary, 13 for multiclass

    cnn_bilstm:
      input_dim: 70
      conv_filters: [64, 128]
      kernel_sizes: [3, 3]
      lstm_hidden_dim: 128
      lstm_layers: 2
      bidirectional: true
      dropout: 0.3
      output_dim: 2

    transformer_ddos:
      input_dim: 70
      d_model: 128
      nhead: 8
      num_layers: 4
      dim_feedforward: 256
      dropout: 0.1
      activation: "gelu"
      output_dim: 2

    autoencoder:
      input_dim: 70
      latent_dim: 16
      encoder_dims: [128, 64, 32]
      decoder_dims: [32, 64, 128]
      contamination_rate: 0.05

  ensemble:
    voting:
      voting: "soft"
      weights: [0.3, 0.4, 0.3] # RF, XGBoost, DeepMLP
    stacking:
      meta_classifier: "logistic_regression"
      use_probabilities: true
