project:
  name: "DDoS-AI"
  description: "Advanced Deep Learning & Machine Learning DDoS Detection and Defense Platform"
  version: "1.0.0"
  author: "Dar Rehan Rasool"
  license: "MIT"
  created_at: "2026-10-18"

environment:
  seed: 42
  deterministic: true
  benchmark: false
  precision: "float32" # float32, mixed_float16, bfloat16

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  manifest_dir: "data/manifests"
  checkpoints_dir: "checkpoints"
  models_dir: "models"
  outputs_dir: "outputs"
  logs_dir: "logs"
  reports_dir: "reports"
  visualizations_dir: "visualizations"
  papers_dir: "papers"
  experiments_dir: "experiments"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s"
  handlers:
    - "console"
    - "file"
  file_path: "logs/application/ddos_ai.log"
