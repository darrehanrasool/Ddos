datasets:
  primary: "CIC-DDoS2019"
  supported:
    - id: "CIC-DDoS2019"
      name: "CIC DDoS 2019 Benchmark Dataset"
      institution: "Canadian Institute for Cybersecurity (UNB)"
      year: 2019
      raw_format: "csv"
      total_attacks: 12
      source_url: "https://www.unb.ca/cic/datasets/ddos-2019.html"
      checksum_sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
    - id: "CIC-IDS2017"
      name: "CIC IDS 2017 Dataset"
      institution: "UNB"
      year: 2017
      raw_format: "csv"
    - id: "BoT-IoT"
      name: "The BoT-IoT Dataset"
      institution: "UNSW Canberra Cyber"
      year: 2018
      raw_format: "csv"
    - id: "TON_IoT"
      name: "Telemetry Dataset for IoT and IIoT"
      institution: "UNSW"
      year: 2020
      raw_format: "csv"

features:
  target_column: "Label"
  binary_mapping:
    BENIGN: 0
    ATTACK: 1
  multiclass_mapping:
    BENIGN: 0
    Syn: 1
    UDP: 2
    UDPLag: 3
    DNS: 4
    LDAP: 5
    MSSQL: 6
    NetBIOS: 7
    NTP: 8
    SNMP: 9
    SSDP: 10
    TFTP: 11
    PortScan: 12

  numerical_features:
    - "Flow Duration"
    - "Total Fwd Packets"
    - "Total Backward Packets"
    - "Total Length of Fwd Packets"
    - "Total Length of Bwd Packets"
    - "Fwd Packet Length Max"
    - "Fwd Packet Length Min"
    - "Fwd Packet Length Mean"
    - "Fwd Packet Length Std"
    - "Bwd Packet Length Max"
    - "Bwd Packet Length Min"
    - "Bwd Packet Length Mean"
    - "Bwd Packet Length Std"
    - "Flow Bytes/s"
    - "Flow Packets/s"
    - "Flow IAT Mean"
    - "Flow IAT Std"
    - "Flow IAT Max"
    - "Flow IAT Min"
    - "Fwd IAT Total"
    - "Fwd IAT Mean"
    - "Fwd IAT Std"
    - "Fwd IAT Max"
    - "Fwd IAT Min"
    - "Bwd IAT Total"
    - "Bwd IAT Mean"
    - "Bwd IAT Std"
    - "Bwd IAT Max"
    - "Bwd IAT Min"
    - "Fwd PSH Flags"
    - "Bwd PSH Flags"
    - "Fwd URG Flags"
    - "Bwd URG Flags"
    - "Fwd Header Length"
    - "Bwd Header Length"
    - "Fwd Packets/s"
    - "Bwd Packets/s"
    - "Min Packet Length"
    - "Max Packet Length"
    - "Packet Length Mean"
    - "Packet Length Std"
    - "Packet Length Variance"
    - "FIN Flag Count"
    - "SYN Flag Count"
    - "RST Flag Count"
    - "PSH Flag Count"
    - "ACK Flag Count"
    - "URG Flag Count"
    - "CWE Flag Count"
    - "ECE Flag Count"
    - "Down/Up Ratio"
    - "Average Packet Size"
    - "Avg Fwd Segment Size"
    - "Avg Bwd Segment Size"
    - "Subflow Fwd Packets"
    - "Subflow Fwd Bytes"
    - "Subflow Bwd Packets"
    - "Subflow Bwd Bytes"
    - "Init_Win_bytes_forward"
    - "Init_Win_bytes_backward"
    - "act_data_pkt_fwd"
    - "min_seg_size_forward"
    - "Active Mean"
    - "Active Std"
    - "Active Max"
    - "Active Min"
    - "Idle Mean"
    - "Idle Std"
    - "Idle Max"
    - "Idle Min"

preprocessing:
  handle_missing: "median" # drop, mean, median, zero
  handle_infinity: "clip_max" # replace with max finite float or drop
  scaling: "robust" # standard, robust, minmax
  clip_outliers: true
  outlier_quantile: 0.999
  remove_duplicates: true
  remove_zero_variance: true

splitting:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  strategy: "stratified" # stratified, temporal, group
  stratify_by: "Label"
  shuffle: true
  random_state: 42
